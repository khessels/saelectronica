<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Icon: chip outline with circuit-trace "S" -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="160" height="160" rx="20" fill="none" stroke="#2a353c" stroke-width="8"/>

    <!-- Circuit trace forming an S shape -->
    <path d="M 118 40
             L 70 40
             Q 50 40 50 60
             L 50 70
             Q 50 90 70 90
             L 90 90
             Q 110 90 110 110
             L 110 120
             Q 110 140 90 140
             L 42 140"
          fill="none" stroke="#49b98c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Circuit nodes -->
    <circle cx="118" cy="40" r="8" fill="#e8a33d"/>
    <circle cx="50" cy="70" r="6" fill="#49b98c"/>
    <circle cx="110" cy="110" r="6" fill="#49b98c"/>
    <circle cx="42" cy="140" r="8" fill="#e8a33d"/>

    <!-- branch traces suggesting plug prongs / PCB pads -->
    <line x1="118" y1="40" x2="140" y2="40" stroke="#e6a468" stroke-width="6" stroke-linecap="round"/>
    <line x1="42" y1="140" x2="20" y2="140" stroke="#e6a468" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="40" r="5" fill="#e6a468"/>
    <circle cx="20" cy="140" r="5" fill="#e6a468"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="105" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="50" fill="#edeae0" letter-spacing="1">SANTRONICS</text>
  <text x="212" y="135" font-family="DejaVu Sans Mono, monospace" font-weight="400" font-size="17" fill="#e8a33d" letter-spacing="3">ELECTRONICA · SANTA ANA</text>
</svg>
